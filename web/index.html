<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Fill the screen (inside the notch's safe area) and never zoom: the game
         handles every touch itself -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#1f2b21">
    <!-- Launched from the iPhone home screen it runs full screen, like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paw & Claw">
    <!-- Home screen and install icons: drawn by tools/web/icons.sh -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Paw & Claw</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #1f2b21;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #1f2b21;
            color: #f3e6c8;
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
            padding: 24px;
        }
        .overlay h1 { font-size: 40px; letter-spacing: 1px; }
        .overlay p { font-size: 17px; color: #e8c97a; max-width: 30em; line-height: 1.4; }
        .bar { width: 180px; height: 6px; border-radius: 3px; background: #33402f; overflow: hidden; }
        .bar::after {
            content: ""; display: block; width: 40%; height: 100%; background: #d9a441;
            animation: slide 1.1s ease-in-out infinite alternate;
        }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

        /* Held upright, ask for landscape */
        #rotate { display: none; z-index: 10; }
        @media (orientation: portrait) and (max-width: 820px) {
            #rotate { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="game-canvas" tabindex="0"></canvas>

    <div class="overlay" id="loading">
        <h1>Paw &amp; Claw</h1>
        <div class="bar"></div>
        <p>Rallying the woodland armies…</p>
    </div>

    <div class="overlay" id="rotate">
        <h1>↻</h1>
        <p>Turn your device sideways to play.</p>
    </div>

    <script>
        // Saves live in localStorage. Ask the browser to keep it even when
        // space runs low (installed home-screen apps usually get this anyway)
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
        }

        // Backups for the game (src/game/save.rs). A home-screen app keeps its
        // storage apart from the browser tab's, so saves move between them as a file.
        window.pawExportSaves = function (filename, json) {
            const file = new File([json], filename, { type: 'application/json' });
            // Phones: the share sheet (Save to Files, AirDrop, ...); if the
            // browser refuses it (not cancelled by the player), download instead
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: 'Paw & Claw saves' }).catch((error) => {
                    if (error && error.name !== 'AbortError') download(file, filename);
                });
                return;
            }
            download(file, filename);
        };

        function download(file, filename) {
            const url = URL.createObjectURL(file);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }

        // The game polls localStorage for the chosen file's text
        window.pawImportSaves = function () {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,application/json,text/plain';
            input.style.display = 'none';
            input.addEventListener('change', async () => {
                const file = input.files && input.files[0];
                if (file) {
                    localStorage.setItem('paw_and_claw_import', await file.text());
                }
                input.remove();
            });
            document.body.appendChild(input);
            input.click();
        };
    </script>

    <script type="module">
        import init from './paw_and_claw.js';

        const loading = document.getElementById('loading');
        const canvas = document.getElementById('game-canvas');

        function fail(message) {
            loading.innerHTML = `<h1>Paw &amp; Claw</h1><p>${message}</p>`;
        }

        // The game draws with WebGL2 (any iPhone from iOS 15 on)
        if (!document.createElement('canvas').getContext('webgl2')) {
            fail('This browser can’t run the game: it needs WebGL 2. Try an up-to-date Safari, Chrome or Firefox.');
        } else {
            // Bevy keeps running after init resolves; hide the loading screen
            // once the first frames are on the canvas
            init().catch((error) => {
                // Bevy's event loop exits by throwing; that isn't a failure
                if (!String(error).includes('Using exceptions for control flow')) {
                    console.error(error);
                    fail('Something went wrong while starting the game. Reloading the page may help.');
                }
            });
            const ready = setInterval(() => {
                if (canvas.width > 0 && canvas.height > 0) {
                    clearInterval(ready);
                    setTimeout(() => loading.remove(), 400);
                    canvas.focus();
                }
            }, 100);
        }
    </script>
</body>
</html>
