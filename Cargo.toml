[package]
name = "paw-and-claw"
version = "0.1.0"
edition = "2021"
description = "A turn-based tactics game featuring animal factions battling for territory"
license = "MIT"
repository = "https://github.com/raskell-io/paw-and-claw"

[dependencies]
# Only the engine parts the game uses (a smaller web download): 3D board with
# StandardMaterial, Text2d HP numbers, gizmos, gamepads, OGG/WAV audio, PNG
# sprites. No glTF, scenes, animation, Bevy UI or picking (the UI is egui)
bevy = { version = "0.17", default-features = false, features = [
    "std", "async_executor", "multi_threaded",
    "bevy_asset", "bevy_audio", "vorbis", "wav", "bevy_image", "png",
    "bevy_color", "bevy_core_pipeline", "bevy_render", "bevy_pbr", "bevy_mesh",
    "bevy_camera", "bevy_light", "bevy_shader", "bevy_gizmos",
    "bevy_text", "default_font", "bevy_sprite", "bevy_sprite_render",
    "tonemapping_luts", "ktx2", "zstd_rust",
    "bevy_gilrs", "bevy_log", "bevy_state", "bevy_window", "bevy_winit",
    "x11", "wayland", "webgl2",
] }
bevy_egui = { version = "0.38", default-features = false, features = [
    "render", "default_fonts", "manage_clipboard", "open_url",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Storage"] }
# Randomness comes from the browser (rand 0.8 uses getrandom 0.2; newer crates 0.3)
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The web build: release, with symbols stripped (tools/web/build.sh)
[profile.web-release]
inherits = "release"
strip = true
panic = "abort"
