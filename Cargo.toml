[package]
name = "paw-and-claw"
version = "0.1.0"
edition = "2021"
description = "A turn-based tactics game featuring animal factions battling for territory"
license = "MIT"
repository = "https://github.com/raskell-io/paw-and-claw"

[dependencies]
bevy = { version = "0.17", features = ["wayland", "wav"] }
bevy_ecs_tilemap = "0.17"
bevy_egui = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Storage"] }
# Randomness comes from the browser (rand 0.8 uses getrandom 0.2; newer crates 0.3)
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The web build: release, with symbols stripped (tools/web/build.sh)
[profile.web-release]
inherits = "release"
strip = true
panic = "abort"
